name: CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Enable Corepack (for Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run unit tests
        run: yarn test:unit

      - name: Run build library
        run: yarn build

      # Раньше exclude в tsconfig.build.json использовал шаблон `*.(test|spec).ts`,
      # который TypeScript не понимает (групп с альтернативой в его glob нет),
      # и скомпилированные тесты молча уезжали в npm-пакет. Проверка сторожит регрессию.
      - name: Check package contents
        run: |
          FILES=$(npm pack --dry-run --json | node -e "
            let d = '';
            process.stdin.on('data', (c) => (d += c));
            process.stdin.on('end', () => {
              const pkg = JSON.parse(d)[0];
              const bad = pkg.files
                .map((f) => f.path)
                .filter((p) => /\.(test|spec)\./.test(p) || p.startsWith('build/src/test/'));
              console.log(JSON.stringify({ total: pkg.entryCount, bad }));
            });
          ")
          echo "$FILES"
          node -e "
            const { total, bad } = JSON.parse(process.argv[1]);
            if (bad.length) {
              console.error('Тестовые файлы попали в пакет:\n' + bad.join('\n'));
              process.exit(1);
            }
            console.log('Пакет чист: ' + total + ' файлов, тестов нет');
          " "$FILES"