# Обновление зависимостей.
#
# ЗАЧЕМ ЭТО ЗДЕСЬ. Библиотека стоит на трёх неподдерживаемых пакетах (`odata-v4-parser`,
# `odata-v4-sql`, `odata-v4-literal` — последние релизы 2016–2018 годов, дефект A-10).
# Обновить их некому, но всё остальное дерево должно оставаться живым: чем дольше
# зависимости не двигаются, тем дороже потом единый скачок.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Мелкие обновления складываются в один PR: пять отдельных с поднятием патч-версии
    # никто не читает, и они начинают проходить не глядя.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Мажорные версии TypeScript и TypeORM ломают код, а не конфигурацию,
      # и требуют отдельной работы, а не проверки CI.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: typeorm
        update-types: [version-update:semver-major]

  # Экшены в workflow тоже устаревают, а их версии закреплены строкой в YAML,
  # то есть никаким `yarn upgrade` не обновятся.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
